{% extends "base.html" %}{% block content %}<article class="card"><small>{{thread.mode|upper}}</small><h1>{{thread.title}}</h1><p class="story">{{thread.body}}</p><div class="meta"><span data-expiry="{{thread.expires_at.isoformat()}}"></span><button class="danger" id="delete-thread" data-id="{{thread.id}}">Borrar si soy el autor</button></div></article><section class="card"><h2>Aportar</h2><form id="reply-form" data-id="{{thread.id}}"><textarea name="body" maxlength="3000" placeholder="Pregunta, aporta contexto o una pista." required></textarea><button>Enviar aporte (+10 min)</button><p class="error"></p></form></section><section><h2>Voces del hilo</h2>{% for r in replies %}<article class="reply"><strong>{{r.alias}}</strong><p>{{r.body}}</p></article>{% else %}<p class="empty">Todavía nadie ha respondido.</p>{% endfor %}</section>{% endblock %}
